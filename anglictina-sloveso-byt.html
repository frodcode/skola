<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sloveso být – to be 🙋</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg,#8ec5fc,#e0c3fc); min-height: 100vh; color: #222; }
  header { text-align: center; padding: 18px 10px 6px; }
  h1 { margin: 0; font-size: 2rem; color: #fff; text-shadow: 2px 2px 0 #5b4bb7; }
  .score { margin-top: 6px; font-size: 1.2rem; color: #fff; font-weight: bold; }
  nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px; }
  nav button { font-size: 1.05rem; padding: 10px 18px; border: none; border-radius: 30px; cursor: pointer; background: #fff; color: #5b4bb7; font-weight: bold; box-shadow: 0 3px 0 #5b4bb7; }
  nav button.active { background: #5b4bb7; color: #fff; }
  main { max-width: 820px; margin: 0 auto 30px; background: #fff; border-radius: 20px; padding: 22px; box-shadow: 0 8px 25px rgba(0,0,0,.15); }
  h2 { margin-top: 0; color: #5b4bb7; }
  h3 { color: #3a2d99; margin: 18px 0 6px; }
  .big { font-size: 2.2rem; text-align: center; margin: 10px 0; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options.three { grid-template-columns: 1fr 1fr 1fr; }
  .options button { font-size: 1.15rem; padding: 14px; border-radius: 12px; border: 2px solid #5b4bb7; background: #fff; cursor: pointer; }
  .options button.ok { background: #c8f7c5; border-color: #2d7a2a; }
  .options button.bad { background: #ffc9c9; border-color: #c0392b; }
  input[type=text] { width: 100%; font-size: 1.5rem; padding: 12px; border-radius: 12px; border: 3px solid #5b4bb7; text-align: center; }
  .btn { font-size: 1.1rem; padding: 10px 20px; border-radius: 12px; border: none; background: #5b4bb7; color: #fff; cursor: pointer; margin: 8px 4px 0; }
  .btn.light { background: #eee; color: #333; }
  .feedback { min-height: 32px; font-size: 1.2rem; text-align: center; margin-top: 10px; font-weight: bold; }
  .good { color: #2d7a2a; } .badc { color: #c0392b; }
  .note { display: block; font-weight: normal; color: #555; font-size: 1rem; margin-top: 4px; }
  .progress { height: 12px; background: #eee; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .progress div { height: 100%; background: #5b4bb7; transition: width .3s; }
  .center { text-align: center; }
  .hint { color: #888; letter-spacing: 4px; font-size: 1.3rem; text-align: center; margin: 6px 0; font-family: monospace; }
  .voice { margin-top: 8px; color: #fff; font-weight: bold; }
  .voice select { font-size: .95rem; padding: 4px 8px; border-radius: 8px; max-width: 90vw; }
  .voicewarn { max-width: 700px; margin: 8px auto 0; background: #fff3cd; color: #6b4e00; border-radius: 10px; font-size: .9rem; padding: 0; }
  .voicewarn:not(:empty) { padding: 8px 12px; }
  .box { background: #f3f0ff; border-radius: 14px; padding: 10px 16px; margin: 10px 0; }
  table.t { border-collapse: collapse; width: 100%; margin: 6px 0 4px; }
  table.t td, table.t th { padding: 8px 10px; border-bottom: 1px solid #e5e0ff; text-align: left; }
  table.t th { color: #5b4bb7; }
  .sp { display: inline-block; cursor: pointer; font-weight: bold; color: #3a2d99; padding: 3px 8px; border-radius: 8px; background: #f3f0ff; border: 2px solid transparent; }
  .sp:hover { border-color: #5b4bb7; }
  .sp.on { background: #ddd6ff; border-color: #5b4bb7; }
  .sp .ico { font-size: .85em; }
  .en { font-weight: bold; color: #3a2d99; }
  .short { color: #888; }
  .sent { font-size: 1.6rem; text-align: center; margin: 14px 0 6px; font-weight: bold; color: #3a2d99; }
  .gap { display: inline-block; min-width: 80px; border-bottom: 3px solid #5b4bb7; color: #5b4bb7; }
  .cz { color: #777; text-align: center; font-size: 1.05rem; font-style: italic; margin: 4px 0 12px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; min-height: 64px; padding: 8px; margin: 10px 0; border-radius: 14px; }
  .wrap.ans { border: 3px dashed #5b4bb7; background: #faf9ff; }
  .wt { padding: 10px 14px; background: #f3f0ff; border-radius: 10px; font-size: 1.25rem; cursor: pointer; border: 2px solid #5b4bb7; user-select: none; }
  .wt:hover { background: #ddd6ff; }
  .punct { font-size: 1.6rem; font-weight: bold; color: #5b4bb7; }
  .ok-x { color: #2d7a2a; font-weight: bold; } .no-x { color: #c0392b; font-weight: bold; }
  @media (max-width: 560px) { .options, .options.three { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🙋 Sloveso být – to be</h1>
  <div class="score">⭐ Body: <span id="score">0</span></div>
  <div class="voice">🔊 Hlas: <select id="voiceSel"><option>načítám…</option></select></div>
  <div class="voicewarn" id="voiceWarn"></div>
</header>
<nav>
  <button data-mode="learn" class="active">📖 Učím se</button>
  <button data-mode="fill">🧩 Doplň am/is/are</button>
  <button data-mode="transform">🔄 Přeměň větu</button>
  <button data-mode="order">🧱 Slož větu</button>
  <button data-mode="write">✏️ Psaní</button>
</nav>
<main id="app"></main>

<script>
/* s = podmět, p = zájmeno (určuje am/is/are), r = zbytek věty, ap = zájmeno v krátké odpovědi */
const SENTENCES = [
  { s: "I", p: "I", r: "at home", cz: "Jsem doma.", czN: "Nejsem doma.", czQ: "Jsem doma?" },
  { s: "I", p: "I", r: "happy", cz: "Jsem šťastný.", czN: "Nejsem šťastný.", czQ: "Jsem šťastný?" },
  { s: "You", p: "you", r: "my friend", cz: "Jsi můj kamarád.", czN: "Nejsi můj kamarád.", czQ: "Jsi můj kamarád?" },
  { s: "You", p: "you", r: "ten years old", rAlt: ["ten"], cz: "Je ti deset let.", czN: "Není ti deset let.", czQ: "Je ti deset let?" },
  { s: "He", p: "he", r: "your brother", cz: "On je tvůj bratr.", czN: "On není tvůj bratr.", czQ: "Je on tvůj bratr?" },
  { s: "She", p: "she", r: "your sister", cz: "Ona je tvoje sestra.", czN: "Ona není tvoje sestra.", czQ: "Je ona tvoje sestra?" },
  { s: "It", p: "it", r: "a cat", cz: "Je to kočka.", czN: "Není to kočka.", czQ: "Je to kočka?" },
  { s: "It", p: "it", r: "red", cz: "Je to červené.", czN: "Není to červené.", czQ: "Je to červené?" },
  { s: "We", p: "we", r: "in the classroom", rAlt: ["in the class", "in class", "in our classroom"], cz: "Jsme ve třídě.", czN: "Nejsme ve třídě.", czQ: "Jsme ve třídě?" },
  { s: "They", p: "they", r: "happy", cz: "Oni jsou šťastní.", czN: "Oni nejsou šťastní.", czQ: "Jsou šťastní?" },
  { s: "You", p: "you", ap: "we", r: "good pupils", rAlt: ["good students"], cz: "Vy jste dobří žáci.", czN: "Vy nejste dobří žáci.", czQ: "Jste dobří žáci?" },
  { s: "Tom", p: "he", r: "at home", cz: "Tom je doma.", czN: "Tom není doma.", czQ: "Je Tom doma?" },
  { s: "Your mum", p: "she", sAlt: ["Your mom", "Your mother"], r: "a teacher", cz: "Tvoje maminka je učitelka.", czN: "Tvoje maminka není učitelka.", czQ: "Je tvoje maminka učitelka?" },
  { s: "The dog", p: "it", sAlt: ["That dog", "This dog"], r: "big", cz: "Ten pes je velký.", czN: "Ten pes není velký.", czQ: "Je ten pes velký?" },
  { s: "The pencils", p: "they", sAlt: ["Those pencils", "These pencils"], r: "blue", cz: "Ty tužky jsou modré.", czN: "Ty tužky nejsou modré.", czQ: "Jsou ty tužky modré?" },
  { s: "Anna", p: "she", r: "eleven", rAlt: ["eleven years old"], cz: "Anně je jedenáct let.", czN: "Anně není jedenáct let.", czQ: "Je Anně jedenáct let?" },
  { s: "He", p: "he", r: "tired", cz: "On je unavený.", czN: "On není unavený.", czQ: "Je unavený?" },
  { s: "It", p: "it", r: "Monday", cz: "Je pondělí.", czN: "Není pondělí.", czQ: "Je pondělí?" },
  { s: "They", p: "they", r: "in the garden", cz: "Oni jsou na zahradě.", czN: "Oni nejsou na zahradě.", czQ: "Jsou na zahradě?" },
  { s: "We", p: "we", r: "friends", cz: "Jsme kamarádi.", czN: "Nejsme kamarádi.", czQ: "Jsme kamarádi?" },
  { s: "She", p: "she", r: "in the kitchen", cz: "Ona je v kuchyni.", czN: "Ona není v kuchyni.", czQ: "Je ona v kuchyni?" },
];
const KEEP_CAPS = new Set(["I", "Tom", "Anna", "Monday"]);

let score = +(localStorage.getItem("beScore") || 0);
const app = document.getElementById("app");
const scoreEl = document.getElementById("score");
scoreEl.textContent = score;

function addScore(n) { score += n; localStorage.setItem("beScore", score); scoreEl.textContent = score; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
let voices = [], voice = null;
const voiceSel = document.getElementById("voiceSel"), voiceWarn = document.getElementById("voiceWarn");
function voiceRank(v) {
  const l = v.lang.replace("_", "-").toLowerCase(), n = v.name.toLowerCase();
  let r = 0;
  if (l === "en-gb" || /united kingdom|uk english|british/.test(n)) r += 100;
  if (/natural|online|neural/.test(n)) r += 20;
  if (/google/.test(n)) r += 10;
  if (/sonia|ryan|libby|hazel|george|susan|daniel|kate|serena/.test(n)) r += 5;
  return r;
}
function loadVoices() {
  if (!("speechSynthesis" in window)) { voiceWarn.textContent = "Tento prohlížeč neumí předčítat."; return; }
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceRank(b) - voiceRank(a));
  const hasGB = voices.some(v => voiceRank(v) >= 100);
  voiceWarn.innerHTML = hasGB ? "" :
    "⚠️ Britský hlas nenalezen. Otevřete stránku v <b>Microsoft Edge</b> (hlasy Sonia/Ryan) nebo v <b>Chrome</b> (Google UK English), " +
    "případně ve Windows: Nastavení → Čas a jazyk → Jazyk a oblast → Přidat jazyk → English (United Kingdom) se zaškrtnutým <i>Převod textu na řeč</i>, pak restartovat prohlížeč.";
  if (!voices.length) { voiceSel.innerHTML = "<option>žádný anglický hlas</option>"; return; }
  const saved = localStorage.getItem("schoolVoice");
  voice = voices.find(v => v.name === saved) || voices[0];
  voiceSel.innerHTML = voices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join("");
  voiceSel.value = voice.name;
}
voiceSel.onchange = () => { voice = voices.find(v => v.name === voiceSel.value); localStorage.setItem("schoolVoice", voice.name); speak("Hello! I am your English teacher."); };
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } else loadVoices();

function speak(text, rate) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
  u.rate = rate || 0.8;
  speechSynthesis.speak(u);
}
function norm(s) { return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").trim(); }
function normS(s) { return norm(s).replace(/[.?!,]/g, " ").replace(/\s+/g, " ").trim(); }

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  ({ learn, fill, transform, order, write })[b.dataset.mode]();
});

/* --- gramatika --- */
const beOf = p => p === "I" ? "am" : ["he", "she", "it"].includes(p) ? "is" : "are";
const be = x => beOf(x.p);
const cap = s => s[0].toUpperCase() + s.slice(1);
const lowerFirst = s => { const w = s.split(" "); if (!KEEP_CAPS.has(w[0])) w[0] = w[0].toLowerCase(); return w.join(" "); };
const isPronoun = (subj, x) => subj.toLowerCase() === x.p.toLowerCase();
const contr = b => b === "am" ? "'m" : b === "is" ? "'s" : "'re";
const negContr = (subj, b) => b === "am" ? `${subj}'m not` : b === "is" ? `${subj} isn't` : `${subj} aren't`;
const wrongBe = b => b === "am" ? "is" : b === "is" ? "are" : "is";
const pos = x => `${x.s} ${be(x)} ${x.r}.`;
const negFull = x => `${x.s} ${be(x)} not ${x.r}.`;
const negShort = x => `${negContr(x.s, be(x))} ${x.r}.`;
const quest = x => `${cap(be(x))} ${lowerFirst(x.s)} ${x.r}?`;
const ansPron = x => x.ap || ({ I: "you", you: "I" }[x.p] || x.p);
function shortYes(x) { const a = ansPron(x); return `Yes, ${a} ${beOf(a)}.`; }
function shortNo(x) { const a = ansPron(x); return `No, ${negContr(a, beOf(a))}.`; }
const RULE = {
  am: "I → <b>am</b>",
  is: "he / she / it (jeden člověk, zvíře, věc) → <b>is</b>",
  are: "you / we / they (a množné číslo) → <b>are</b>",
};

function accepted(x, kind) {
  const out = [];
  const b = be(x);
  for (const subj of [x.s, ...(x.sAlt || [])]) for (const rest of [x.r, ...(x.rAlt || [])]) {
    const canContr = isPronoun(subj, x) || b === "is";
    if (kind === "pos") {
      out.push(`${subj} ${b} ${rest}`);
      if (canContr) out.push(`${subj}${contr(b)} ${rest}`);
    } else if (kind === "neg") {
      out.push(`${subj} ${b} not ${rest}`, `${negContr(subj, b)} ${rest}`);
      if (canContr && b !== "am") out.push(`${subj}${contr(b)} not ${rest}`);
    } else out.push(`${b} ${subj} ${rest}`);
  }
  return out.map(normS);
}

/* 📖 Learn */
const sp = t => `<span class="sp" data-say="${t}">${t} <span class="ico">🔊</span></span>`;
function row(en, short, cz) {
  return `<tr><td>${sp(en)}</td><td>${sp(short)}</td><td>${cz}</td></tr>`;
}
function row3(a, b, c) { return `<tr><td>${sp(a)}</td><td>${sp(b)}</td><td>${sp(c)}</td></tr>`; }
function learn() {
  app.innerHTML = `<h2>📖 Sloveso být – <i>to be</i></h2>
    <p>Klikni na anglický text s 🔊 a poslechni si výslovnost. Sloveso <b>být</b> má v přítomném čase jen tři tvary: <b>am</b>, <b>is</b>, <b>are</b>.</p>

    <h3>✅ Oznamovací věty</h3>
    <table class="t"><tr><th>celý tvar</th><th>zkrácený tvar</th><th>česky</th></tr>
      ${row("I am", "I'm", "já jsem")}
      ${row("you are", "you're", "ty jsi")}
      ${row("he is", "he's", "on je")}
      ${row("she is", "she's", "ona je")}
      ${row("it is", "it's", "ono / to je")}
      ${row("we are", "we're", "my jsme")}
      ${row("you are", "you're", "vy jste")}
      ${row("they are", "they're", "oni / ony jsou")}
    </table>
    <div class="box">💡 <b>I</b> (já) se píše vždy velkým písmenem. Tom, my mum, Anna = <b>he / she</b> → <b>is</b>. Více lidí nebo věcí (the pencils, my friends) = <b>they</b> → <b>are</b>.</div>

    <h3>❌ Zápor – přidáme <i>not</i></h3>
    <table class="t"><tr><th>celý tvar</th><th>zkrácený tvar</th><th>česky</th></tr>
      ${row("I am not", "I'm not", "já nejsem")}
      ${row("you are not", "you aren't", "ty nejsi")}
      ${row("he is not", "he isn't", "on není")}
      ${row("she is not", "she isn't", "ona není")}
      ${row("it is not", "it isn't", "ono / to není")}
      ${row("we are not", "we aren't", "my nejsme")}
      ${row("you are not", "you aren't", "vy nejste")}
      ${row("they are not", "they aren't", "oni nejsou")}
    </table>
    <div class="box">⚠️ <b>I amn't</b> neexistuje – říkáme <b>I'm not</b>.</div>

    <h3>❓ Otázka – <i>am / is / are</i> jde na začátek</h3>
    <table class="t"><tr><th>oznamovací věta</th><th></th><th>otázka</th></tr>
      <tr><td>${sp("You are happy.")}</td><td>➡️</td><td>${sp("Are you happy?")}</td></tr>
      <tr><td>${sp("He is at home.")}</td><td>➡️</td><td>${sp("Is he at home?")}</td></tr>
      <tr><td>${sp("They are friends.")}</td><td>➡️</td><td>${sp("Are they friends?")}</td></tr>
      <tr><td>${sp("I am late.")}</td><td>➡️</td><td>${sp("Am I late?")}</td></tr>
    </table>

    <h3>💬 Krátké odpovědi</h3>
    <table class="t"><tr><th>otázka</th><th>ano 👍</th><th>ne 👎</th></tr>
      ${row3("Are you ten?", "Yes, I am.", "No, I'm not.")}
      ${row3("Is he your brother?", "Yes, he is.", "No, he isn't.")}
      ${row3("Is it a cat?", "Yes, it is.", "No, it isn't.")}
      ${row3("Are they happy?", "Yes, they are.", "No, they aren't.")}
    </table>
    <div class="box">⚠️ V odpovědi <b>ano</b> se nezkracuje: <span class="ok-x">Yes, I am. ✔</span> &nbsp; <span class="no-x">Yes, I'm. ✘</span><br>
      Na otázku <b>Are you…?</b> (jsi?) odpovídáš <b>I am</b> (já jsem).</div>

    <h3>🗣️ Pozor na češtinu</h3>
    <div class="box">Česky říkáme <b>„Je mi deset let.“</b>, anglicky ale ${sp("I am ten.")} (já jsem deset).<br>
      Česky stačí <b>„Je to kočka.“</b>, anglicky musí být podmět: ${sp("It is a cat.")}</div>`;
  app.querySelectorAll(".sp").forEach(s => s.onclick = () => {
    app.querySelectorAll(".sp.on").forEach(x => x.classList.remove("on"));
    s.classList.add("on");
    speak(s.dataset.say, 0.7);
  });
}
/* společný kvíz s výběrem odpovědi */
function runMC(title, again, items) {
  let i = 0, correct = 0;
  function show() {
    if (i >= items.length) return finish(correct, items.length, again);
    const it = items[i];
    const opts = it.fixed ? it.opts : shuffle(it.opts);
    app.innerHTML = `<h2>${title} (${i + 1}/${items.length})</h2>
      <div class="progress"><div style="width:${i / items.length * 100}%"></div></div>
      ${it.html}
      <div class="options${opts.length === 3 ? " three" : ""}">${opts.map((o, k) => `<button data-k="${k}"></button>`).join("")}</div>
      <div class="feedback" id="fb"></div><div class="center" id="nx"></div>`;
    const btns = [...app.querySelectorAll(".options button")];
    btns.forEach((b, k) => { b.textContent = opts[k]; });
    btns.forEach((b, k) => b.onclick = () => {
      btns.forEach((x, m) => { x.disabled = true; if (opts[m] === it.correct) x.classList.add("ok"); });
      const fb = app.querySelector("#fb");
      const next = () => { i++; show(); };
      speak(it.say);
      if (opts[k] === it.correct) {
        correct++; addScore(2);
        fb.innerHTML = `<span class="good">Výborně! ⭐ <span class="note">${it.note}</span></span>`;
        setTimeout(next, 1800);
      } else {
        b.classList.add("bad");
        fb.innerHTML = `<span class="badc">Správně je: ${it.say}<span class="note">${it.note}</span></span>`;
        const n = app.querySelector("#nx");
        n.innerHTML = `<button class="btn">Další ➡️</button>`;
        n.firstChild.onclick = next;
      }
    });
  }
  show();
}

/* 🧩 Fill */
function fill() {
  const items = shuffle(SENTENCES).slice(0, 10).map(x => {
    const b = be(x), t = pick(["pos", "pos", "neg", "q"]);
    if (t === "pos") return { fixed: true, opts: ["am", "is", "are"], correct: b, say: pos(x), note: RULE[b],
      html: `<div class="sent">${x.s} <span class="gap">?</span> ${x.r}.</div><p class="cz">${x.cz}</p>` };
    if (t === "neg") return { fixed: true, opts: ["am not", "isn't", "aren't"], correct: b === "am" ? "am not" : b + "n't", say: negShort(x),
      note: RULE[b] + " + not", html: `<div class="sent">${x.s} <span class="gap">?</span> ${x.r}.</div><p class="cz">${x.czN}</p>` };
    return { fixed: true, opts: ["Am", "Is", "Are"], correct: cap(b), say: quest(x), note: RULE[b] + " – v otázce jde na začátek",
      html: `<div class="sent"><span class="gap">?</span> ${lowerFirst(x.s)} ${x.r}?</div><p class="cz">${x.czQ}</p>` };
  });
  runMC("🧩 Doplň správný tvar", fill, items);
}

/* 🔄 Transform */
function transform() {
  const items = shuffle(SENTENCES).slice(0, 10).map(x => {
    const b = be(x), s = x.s, sl = lowerFirst(x.s), t = pick(["neg", "q", "short"]);
    if (t === "neg") {
      const ok = pick([negFull(x), negShort(x)]);
      const wb = b === "am" ? "isn't" : b === "is" ? "aren't" : "isn't";
      return { correct: ok, say: ok, note: "Zápor: za am / is / are přidáme <b>not</b>.",
        opts: [ok, `${s} not ${b} ${x.r}.`, `${s} ${wb} ${x.r}.`, `${s} don't ${x.r}.`],
        html: `<p class="center">Přeměň na <b>zápor</b> ❌</p><div class="sent">${pos(x)}</div>` };
    }
    if (t === "q") {
      const ok = quest(x);
      return { correct: ok, say: ok, note: "Otázka: am / is / are jde <b>na začátek</b>.",
        opts: [ok, `${s} ${b} ${x.r}?`, `${cap(wrongBe(b))} ${sl} ${x.r}?`, `Do ${sl} ${b} ${x.r}?`],
        html: `<p class="center">Přeměň na <b>otázku</b> ❓</p><div class="sent">${pos(x)}</div>` };
    }
    const a = ansPron(x), ab = beOf(a), yes = Math.random() < 0.5;
    if (yes) {
      const ok = shortYes(x);
      return { correct: ok, say: `${quest(x)} ${ok}`, note: "V odpovědi <b>ano</b> se nezkracuje.",
        opts: [ok, `Yes, ${a}${contr(ab)}.`, `Yes, ${a} ${wrongBe(ab)}.`, `Yes, ${ab} ${a}.`],
        html: `<p class="center">Odpověz krátce <b>ANO 👍</b></p><div class="sent">${quest(x)}</div>` };
    }
    const ok = shortNo(x);
    const wn = ab === "is" ? "aren't" : "isn't";
    return { correct: ok, say: `${quest(x)} ${ok}`, note: "V odpovědi <b>ne</b> použijeme zkrácený zápor.",
      opts: [ok, `No, ${a} not.`, `No, ${a} ${wn}.`, ab === "am" ? `No, am not I.` : `No, ${ab}n't ${a}.`],
      html: `<p class="center">Odpověz krátce <b>NE 👎</b></p><div class="sent">${quest(x)}</div>` };
  });
  runMC("🔄 Přeměň větu", transform, items);
}

/* 🧱 Order */
function order() {
  const list = shuffle(SENTENCES).slice(0, 8).map(x => ({ x, t: Math.random() < 0.6 ? "q" : "neg" }));
  let i = 0, correct = 0;
  function show() {
    if (i >= list.length) return finish(correct, list.length, order);
    const { x, t } = list[i];
    const sl = lowerFirst(x.s).split(" "), rw = x.r.split(" ");
    const tokens = t === "q" ? [be(x), ...sl, ...rw] : [...sl, be(x), "not", ...rw];
    const full = t === "q" ? quest(x) : negFull(x);
    let pool = shuffle(tokens.map((w, id) => ({ w, id }))), ans = [], tries = 0;
    if (pool.map(p => p.w).join(" ") === tokens.join(" ")) pool.reverse();
    app.innerHTML = `<h2>🧱 Slož ${t === "q" ? "otázku ❓" : "zápor ❌"} (${i + 1}/${list.length})</h2>
      <div class="progress"><div style="width:${i / list.length * 100}%"></div></div>
      <p class="cz"><b>${t === "q" ? x.czQ : x.czN}</b></p>
      <div class="wrap ans" id="ans"></div>
      <div class="wrap" id="pool"></div>
      <div class="center">
        <button class="btn" id="check">✔️ Zkontrolovat</button>
        <button class="btn light" id="clear">↩️ Vrátit vše</button>
        <button class="btn light" id="skip">⏭️ Nevím</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const ansEl = app.querySelector("#ans"), poolEl = app.querySelector("#pool"), fb = app.querySelector("#fb");
    let locked = false;
    function render() {
      ansEl.innerHTML = ""; poolEl.innerHTML = "";
      ans.forEach(p => { const d = document.createElement("span"); d.className = "wt"; d.textContent = p.w; d.onclick = () => { if (locked) return; ans = ans.filter(q => q !== p); pool.push(p); render(); }; ansEl.appendChild(d); });
      const pu = document.createElement("span"); pu.className = "punct"; pu.textContent = t === "q" ? "?" : "."; ansEl.appendChild(pu);
      pool.forEach(p => { const d = document.createElement("span"); d.className = "wt"; d.textContent = p.w; d.onclick = () => { if (locked) return; pool = pool.filter(q => q !== p); ans.push(p); render(); }; poolEl.appendChild(d); });
    }
    render();
    const done = ok => {
      locked = true; speak(full);
      if (ok) { const pts = tries === 0 ? 3 : 1; correct++; addScore(pts); fb.innerHTML = `<span class="good">Správně! 🎉 +${pts}<span class="note">${full}</span></span>`; setTimeout(() => { i++; show(); }, 1900); }
      else { fb.innerHTML = `<span class="badc">Správně je: <b>${full}</b></span>`; app.querySelector(".center").innerHTML = `<button class="btn" id="nx">Další ➡️</button>`; app.querySelector("#nx").onclick = () => { i++; show(); }; }
    };
    app.querySelector("#check").onclick = () => {
      if (locked) return;
      if (pool.length) { fb.innerHTML = `<span class="badc">Použij všechna slova 🙂</span>`; return; }
      if (ans.map(p => p.w).join(" ") === tokens.join(" ")) return done(true);
      tries++;
      if (tries >= 3) return done(false);
      fb.innerHTML = `<span class="badc">Ještě ne, zkus to znovu (pokus ${tries}/3)<span class="note">${t === "q" ? "Tip: otázka začíná slovem am / is / are." : "Tip: not patří hned za am / is / are."}</span></span>`;
    };
    app.querySelector("#clear").onclick = () => { if (locked) return; pool = pool.concat(ans); ans = []; render(); };
    app.querySelector("#skip").onclick = () => { if (!locked) done(false); };
  }
  show();
}

/* ✏️ Write */
function write() {
  const queue = shuffle(SENTENCES).slice(0, 10).map(x => ({ x, t: pick(["pos", "neg", "q"]) }));
  let i = 0, correct = 0, tries = 0, hintLen = 0;
  function show() {
    if (i >= queue.length) return finish(correct, queue.length, write);
    const { x, t } = queue[i]; tries = 0; hintLen = 0;
    const main = t === "pos" ? pos(x) : t === "neg" ? negShort(x) : quest(x);
    const czText = t === "pos" ? x.cz : t === "neg" ? x.czN : x.czQ;
    const ok = accepted(x, t);
    app.innerHTML = `<h2>✏️ Přelož do angličtiny (${i + 1}/${queue.length})</h2>
      <div class="progress"><div style="width:${i / queue.length * 100}%"></div></div>
      <div class="big">${czText}</div>
      <div class="hint" id="hint"></div>
      <input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sem napiš větu anglicky">
      <div class="center">
        <button class="btn" id="check">✔️ Zkontrolovat</button>
        <button class="btn light" id="hintBtn">💡 Nápověda</button>
        <button class="btn light" id="skip">⏭️ Nevím</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const inp = app.querySelector("#inp"), fb = app.querySelector("#fb"), hint = app.querySelector("#hint");
    inp.focus();
    const renderHint = () => hint.textContent = [...main].map((c, k) => c === " " ? " " : (k < hintLen || /[.?']/.test(c) ? c : "_")).join("");
    renderHint();
    const next = () => setTimeout(() => { i++; show(); }, 2000);
    const fail = () => { fb.innerHTML = `<span class="badc">Správně je: <b>${main}</b></span>`; speak(main); inp.disabled = true; queue.push(queue[i]); next(); };
    const check = () => {
      const v = normS(inp.value);
      if (!v) return;
      if (ok.includes(v)) {
        const pts = Math.max(1, 3 - tries - hintLen);
        correct++; addScore(pts); speak(main);
        fb.innerHTML = `<span class="good">Správně! 🎉 +${pts}<span class="note">${main}</span></span>`;
        inp.disabled = true; next();
      } else {
        tries++;
        if (tries >= 3) fail();
        else fb.innerHTML = `<span class="badc">Ještě ne, zkus to znovu (pokus ${tries}/3)</span>`;
      }
    };
    app.querySelector("#check").onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
    app.querySelector("#hintBtn").onclick = () => { if (hintLen < main.length) { hintLen++; while (main[hintLen - 1] === " ") hintLen++; renderHint(); } inp.focus(); };
    app.querySelector("#skip").onclick = () => { if (!inp.disabled) fail(); };
  }
  show();
}

function finish(correct, total, again) {
  const pct = correct / total;
  const msg = pct === 1 ? "🏆 Perfektní!" : pct >= 0.7 ? "🌟 Skvělá práce!" : "💪 Dobrý začátek, procvič si to ještě!";
  app.innerHTML = `<div class="center"><h2>${msg}</h2><div class="big">${correct} / ${total}</div>
    <button class="btn" id="again">🔄 Znovu</button></div>`;
  app.querySelector("#again").onclick = again;
}

learn();
</script>
