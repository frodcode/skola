<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bb7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Pro 2. ročník</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg,#8ec5fc,#e0c3fc); min-height: 100vh; color: #222; }
  header { text-align: center; padding: 24px 10px 8px; }
  h1 { margin: 0; font-size: 2.2rem; color: #fff; text-shadow: 2px 2px 0 #5b4bb7; }
  .sub { margin-top: 6px; font-size: 1.15rem; color: #fff; font-weight: bold; }
  main { max-width: 820px; margin: 12px auto 30px; padding: 0 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 160px; padding: 18px 12px; background: #fff; border-radius: 20px; text-decoration: none; color: #5b4bb7; box-shadow: 0 6px 0 #5b4bb7, 0 8px 25px rgba(0,0,0,.15); transition: transform .1s; text-align: center; }
  .tile:hover { transform: translateY(-3px); }
  .tile:active { transform: translateY(3px); box-shadow: 0 2px 0 #5b4bb7; }
  .tile .emoji { font-size: 3.2rem; line-height: 1; }
  .tile .name { font-size: 1.35rem; font-weight: bold; }
  .tile .en { font-size: 1rem; color: #777; font-style: italic; }
  .home { display: inline-block; margin-bottom: 6px; color: #fff; text-decoration: none; font-size: .95rem; opacity: .85; }
  .home:hover { opacity: 1; text-decoration: underline; }
  footer { text-align: center; color: #fff; font-size: .9rem; padding-bottom: 20px; opacity: .85; }
  @media (max-width: 520px) {
    h1 { font-size: 1.8rem; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile { min-height: 130px; padding: 14px 8px; }
    .tile .emoji { font-size: 2.6rem; }
    .tile .name { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html">← Všechny ročníky</a><br>
  <h1>✏️ Pro 2. ročník</h1>
  <div class="sub">Brzy tu něco přibude 🙂</div>
</header>
<main>
  <div class="tile" style="min-height:auto"><span class="name">Zatím tu nic není.</span></div>
</main>
<footer>Tip: v Chrome dej &#8942; → Přidat na plochu</footer>
</body>
</html>
