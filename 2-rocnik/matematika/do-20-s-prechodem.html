<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bb7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%9F%3C/text%3E%3C/svg%3E">
<title>Do 20 s přechodem přes 10 🔟</title>
<link rel="stylesheet" href="../../common/skola.css">
<style>
  .frames { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 10px 0; }
  .tf { display: inline-grid; grid-template-columns: repeat(5, 30px); gap: 5px; border: 3px solid #5b4bb7; padding: 6px; border-radius: 10px; background: #fff; }
  .tf i { width: 30px; height: 30px; border-radius: 50%; background: #eee; position: relative; }
  .tf i.a { background: #e74c3c; } .tf i.b { background: #3498db; }
  .tf i.x { background: #f5b7b1; } .tf i.x::after { content: "✕"; position: absolute; inset: 0; text-align: center; line-height: 30px; font-weight: bold; color: #333; }
  .ex { text-align: center; font-size: 1.5rem; margin: 8px 0; }
  .stepq { font-size: 1.8rem; text-align: center; margin: 8px 0; }
  .stepq.done { color: #2d7a2a; font-size: 1.4rem; }
  .legend { text-align: center; font-size: 1rem; color: #555; }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← Všechna témata</a><br>
  <h1>🔟 Do 20 s přechodem</h1>
  <div class="score">⭐ Body: <span id="score">0</span></div>
  <div class="voicewarn" id="voiceWarn"></div>
</header>
<nav>
  <button data-mode="learn" class="active">📖 Učím se</button>
  <button data-mode="steps">🪜 Krok za krokem</button>
  <button data-mode="plus">➕ Sčítání</button>
  <button data-mode="minus">➖ Odčítání</button>
  <button data-mode="mixed">🔀 Smíšené</button>
  <button data-mode="sprint">⏱️ Minutovka</button>
</nav>
<main id="app"></main>

<script src="../../common/skola.js"></script>
<script src="../../common/cvic.js"></script>
<script>
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* dvě desítková políčka: cells[k] = "", "a", "b" nebo "x" */
function frames(cells) { return `<div class="frames"><span class="tf">${cells.slice(0, 10).map(c => `<i class="${c}"></i>`).join("")}</span><span class="tf">${cells.slice(10, 20).map(c => `<i class="${c}"></i>`).join("")}</span></div>`; }
function picture(a, b, op) {
  const c = Array(20).fill("");
  if (op === "+") { for (let k = 0; k < a; k++) c[k] = "a"; for (let k = a; k < a + b; k++) c[k] = "b"; }
  else { for (let k = 0; k < a; k++) c[k] = "a"; for (let k = a - b; k < a; k++) c[k] = "x"; }
  return frames(c);
}
/* rozklad: 8 + 5 = 8 + 2 + 3; 13 − 5 = 13 − 3 − 2 */
function parts(a, b, op) { const p = op === "+" ? 10 - a : a - 10; return [p, b - p]; }
function make(a, b, op) {
  const [p, r] = parts(a, b, op), s = op === "+" ? "+" : "−", res = op === "+" ? a + b : a - b;
  return {
    a, b, op, s, res, p, r, q: `${a} ${s} ${b}`, ans: res,
    help: `${picture(a, b, op)}<div class="ex">${a} ${s} ${b} = ${a} ${s} ${p} ${s} ${r}</div>
      <div class="ex">${a} ${s} ${p} = <b>10</b>, &nbsp; 10 ${s} ${r} = ?</div>`,
  };
}
const genPlus = () => { const a = rnd(2, 9), b = rnd(11 - a, 9); return make(a, b, "+"); };
const genMinus = () => { const a = rnd(11, 18), b = rnd(a - 9, 9); return make(a, b, "-"); };
const genMix = () => Math.random() < .5 ? genPlus() : genMinus();
const forNum = x => ({ q: x.q, a: x.ans, help: x.help });

function learn() {
  const p = make(8, 5, "+"), m = make(13, 5, "-");
  app.innerHTML = `<h2 class="clk" data-say="Počítání do dvaceti s přechodem přes desítku">📖 Přechod přes 10 <span class="ico">🔊</span></h2>
    <div class="box clk" data-say="Když počítáme přes desítku, rozložíme druhé číslo tak, abychom se nejdřív dostali přesně na deset.">💡 Druhé číslo <b>rozložím</b> tak, abych se nejdřív dostal(a) přesně na <b>10</b>. <span class="ico">🔊</span></div>
    <h3 class="hs" data-say="Sčítání">➕ Sčítání <span class="ico">🔊</span></h3>
    <div class="box clk" data-say="8 plus 5. Do desítky chybí 2. Pětku rozložím na 2 a 3. 8 plus 2 je 10. 10 plus 3 je 13.">
      ${picture(8, 5, "+")}
      <div class="ex">8 + 5 = 8 + <b>2</b> + <b>3</b> = 10 + 3 = <b>13</b> <span class="ico">🔊</span></div>
      <div class="legend">Do desítky chybí 2 → 5 rozložím na 2 a 3.</div></div>
    <h3 class="hs" data-say="Odčítání">➖ Odčítání <span class="ico">🔊</span></h3>
    <div class="box clk" data-say="13 mínus 5. Nejdřív odečtu 3, abych byl na desítce. 5 rozložím na 3 a 2. 13 mínus 3 je 10. 10 mínus 2 je 8.">
      ${picture(13, 5, "-")}
      <div class="ex">13 − 5 = 13 − <b>3</b> − <b>2</b> = 10 − 2 = <b>8</b> <span class="ico">🔊</span></div>
      <div class="legend">Od 13 k desítce jsou 3 → 5 rozložím na 3 a 2.</div></div>`;
  czBind();
}

/* krok za krokem: 1) kolik k desítce, 2) kolik ještě zbývá, 3) výsledek */
function steps() {
  cvicRound(Array.from({ length: 6 }, genMix), steps, (x, i, n, done) => {
    const plus = x.op === "+";
    const S = [
      { t: plus ? `${x.a} + <span class="gap">?</span> = 10` : `${x.a} − <span class="gap">?</span> = 10`, a: x.p,
        say: plus ? `${x.a} plus kolik je 10?` : `${x.a} mínus kolik je 10?`, tip: plus ? `Kolik chybí od ${x.a} do deseti?` : `Kolik je od deseti do ${x.a}?` },
      { t: `${x.b} = ${x.p} + <span class="gap">?</span>`, a: x.r, say: `${x.b} je ${x.p} a kolik?`, tip: `Rozlož číslo ${x.b}: ${x.p} a kolik?` },
      { t: `10 ${x.s} ${x.r} = <span class="gap">?</span>`, a: x.res, say: czMath(`10 ${x.s} ${x.r} = ?`), tip: plus ? "Deset a ještě kousek." : "Od deseti odečti zbytek." },
    ];
    let k = 0, mistakes = 0;
    const doneTxt = [`${x.a} ${x.s} ${x.p} = 10`, `${x.b} = ${x.p} + ${x.r}`, `10 ${x.s} ${x.r} = ${x.res}`];
    function show() {
      const st = S[k];
      let tries = 0;
      app.innerHTML = `${cvicHead("🪜 Krok za krokem", i, n)}
        <div class="task clk" id="q">${x.q} = <span class="gap">?</span> <span class="ico">🔊</span></div>
        ${picture(x.a, x.b, x.op)}
        ${doneTxt.slice(0, k).map(t => `<div class="stepq done">✔️ ${t}</div>`).join("")}
        <div class="stepq clk" id="st">${k + 1}️⃣ ${st.t} <span class="ico">🔊</span></div>
        <input type="text" id="inp" class="num" inputmode="numeric" autocomplete="off">
        <div class="pad num">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button data-k="${d}">${d}</button>`).join("")}<button data-k="⌫" class="del">⌫</button><button data-k="✔" class="go">✔️</button></div>
        <div class="feedback" id="fb"></div>`;
      const inp = app.querySelector("#inp"), fb = app.querySelector("#fb");
      app.querySelector("#q").onclick = () => speakCz(czMath(x.q + " = ?"));
      app.querySelector("#st").onclick = () => speakCz(st.say);
      speakCz(k ? st.say : czMath(x.q + " = ?") + " " + st.say);
      inp.focus();
      const check = () => {
        if (!inp.value.trim() || inp.disabled) return;
        if (+inp.value === st.a) {
          inp.disabled = true;
          fb.innerHTML = `<span class="good">Správně! 👍</span>`;
          k++;
          if (k < S.length) return setTimeout(show, 900);
          const pts = mistakes ? 1 : 3; addScore(pts);
          fb.innerHTML = `<span class="good">Výborně! ${x.q} = ${x.res} 🎉 +${pts}</span>`;
          speakCz(czMath(`${x.q} = ${x.res}`));
          setTimeout(() => done(mistakes < 2), 2000);
        } else {
          tries++; mistakes++;
          if (tries >= 3) { fb.innerHTML = `<span class="badc">Správně je ${st.a}.</span>`; inp.value = st.a; inp.disabled = true; k++; setTimeout(() => k < S.length ? show() : done(false), 1800); }
          else { fb.innerHTML = `<span class="badc">${st.tip} (pokus ${tries}/3)</span>`; inp.select(); }
        }
      };
      inp.onkeydown = e => { if (e.key === "Enter") check(); };
      app.querySelectorAll(".pad button").forEach(b => b.onclick = () => {
        if (b.dataset.k === "✔") check();
        else if (b.dataset.k === "⌫") inp.value = inp.value.slice(0, -1);
        else inp.value += b.dataset.k;
      });
    }
    show();
  });
}

const plus = () => cvicNumbers({ title: "➕ Sčítání přes 10", gen: () => forNum(genPlus()), again: plus });
const minus = () => cvicNumbers({ title: "➖ Odčítání přes 10", gen: () => forNum(genMinus()), again: minus });
const mixed = () => cvicNumbers({ title: "🔀 Sčítání i odčítání", gen: () => forNum(genMix()), again: mixed });
const sprint = () => cvicSprint({ title: "Minutovka do 20", gen: () => forNum(genMix()), id: "do20" });

skolaStart({ scoreKey: "mDo20Score", english: false, modes: { learn, steps, plus, minus, mixed, sprint } });
</script>
</body>
</html>
