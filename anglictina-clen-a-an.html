<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bb7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<title>Neurčitý člen a / an 🍎</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg,#8ec5fc,#e0c3fc); min-height: 100vh; color: #222; }
  header { text-align: center; padding: 18px 10px 6px; position: relative; }
  .home { display: inline-block; margin-bottom: 6px; color: #fff; text-decoration: none; font-size: .95rem; opacity: .85; }
  .home:hover { opacity: 1; text-decoration: underline; }
  h1 { margin: 0; font-size: 2rem; color: #fff; text-shadow: 2px 2px 0 #5b4bb7; }
  .score { margin-top: 6px; font-size: 1.2rem; color: #fff; font-weight: bold; }
  nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px; }
  nav button { font-size: 1.05rem; padding: 10px 18px; border: none; border-radius: 30px; cursor: pointer; background: #fff; color: #5b4bb7; font-weight: bold; box-shadow: 0 3px 0 #5b4bb7; }
  nav button.active { background: #5b4bb7; color: #fff; }
  main { max-width: 820px; margin: 0 auto 30px; background: #fff; border-radius: 20px; padding: 22px; box-shadow: 0 8px 25px rgba(0,0,0,.15); }
  h2 { margin-top: 0; color: #5b4bb7; }
  h3 { color: #3a2d99; margin: 18px 0 6px; }
  .big { font-size: 2.2rem; text-align: center; margin: 10px 0; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options.three { grid-template-columns: 1fr 1fr 1fr; }
  .options button { font-size: 1.15rem; padding: 14px; border-radius: 12px; border: 2px solid #5b4bb7; background: #fff; cursor: pointer; }
  .options button.ok { background: #c8f7c5; border-color: #2d7a2a; }
  .options button.bad { background: #ffc9c9; border-color: #c0392b; }
  input[type=text] { width: 100%; font-size: 1.5rem; padding: 12px; border-radius: 12px; border: 3px solid #5b4bb7; text-align: center; }
  .btn { font-size: 1.1rem; padding: 10px 20px; border-radius: 12px; border: none; background: #5b4bb7; color: #fff; cursor: pointer; margin: 8px 4px 0; }
  .btn.light { background: #eee; color: #333; }
  .feedback { min-height: 32px; font-size: 1.2rem; text-align: center; margin-top: 10px; font-weight: bold; }
  .good { color: #2d7a2a; } .badc { color: #c0392b; }
  .note { display: block; font-weight: normal; color: #555; font-size: 1rem; margin-top: 4px; }
  .progress { height: 12px; background: #eee; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .progress div { height: 100%; background: #5b4bb7; transition: width .3s; }
  .center { text-align: center; }
  .hint { color: #888; letter-spacing: 4px; font-size: 1.3rem; text-align: center; margin: 6px 0; font-family: monospace; }
  .voice { margin-top: 8px; color: #fff; font-weight: bold; }
  .voice select { font-size: .95rem; padding: 4px 8px; border-radius: 8px; max-width: 90vw; }
  .voicewarn { max-width: 700px; margin: 8px auto 0; background: #fff3cd; color: #6b4e00; border-radius: 10px; font-size: .9rem; padding: 0; }
  .voicewarn:not(:empty) { padding: 8px 12px; }
  .box { background: #f3f0ff; border-radius: 14px; padding: 10px 16px; margin: 10px 0; }
  table.t { border-collapse: collapse; width: 100%; margin: 6px 0 4px; }
  table.t td, table.t th { padding: 8px 10px; border-bottom: 1px solid #e5e0ff; text-align: left; }
  table.t th { color: #5b4bb7; }
  table.t tr.say { cursor: pointer; }
  table.t tr.say:hover { background: #f3f0ff; }
  .en { font-weight: bold; color: #3a2d99; }
  .short { color: #888; }
  .sent { font-size: 1.6rem; text-align: center; margin: 14px 0 6px; font-weight: bold; color: #3a2d99; }
  .gap { display: inline-block; min-width: 80px; border-bottom: 3px solid #5b4bb7; color: #5b4bb7; }
  .cz { color: #777; text-align: center; font-size: 1.05rem; font-style: italic; margin: 4px 0 12px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; min-height: 64px; padding: 8px; margin: 10px 0; border-radius: 14px; }
  .wrap.ans { border: 3px dashed #5b4bb7; background: #faf9ff; }
  .wt { padding: 10px 14px; background: #f3f0ff; border-radius: 10px; font-size: 1.25rem; cursor: pointer; border: 2px solid #5b4bb7; user-select: none; }
  .wt:hover { background: #ddd6ff; }
  .punct { font-size: 1.6rem; font-weight: bold; color: #5b4bb7; }
  .ok-x { color: #2d7a2a; font-weight: bold; } .no-x { color: #c0392b; font-weight: bold; }
  @media (max-width: 560px) { .options, .options.three { grid-template-columns: 1fr; } }
</style>
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 10px; }
  .card { background: #f3f0ff; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; border: 3px solid transparent; user-select: none; }
  .card:hover { border-color: #5b4bb7; }
  .card .emoji { font-size: 2rem; }
  .card .ph { font-weight: bold; font-size: 1.1rem; color: #3a2d99; }
  .card .cz { font-size: 1rem; font-style: normal; margin: 0; color: #555; border-radius: 8px; }
  .card .cz:hover { background: #e4ddff; }
  .ico { font-size: .8em; opacity: .55; font-style: normal; }
  .say-cz { cursor: pointer; }
  .card .n { color: #c0392b; font-size: .85rem; }
  .art { color: #c0392b; }
  .cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
  .col { border: 3px dashed #5b4bb7; border-radius: 14px; min-height: 160px; padding: 8px; text-align: center; cursor: pointer; background: #faf9ff; }
  .col h3 { margin: 4px 0 8px; }
  .col.hot { background: #ece6ff; }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
  .tile { padding: 10px 14px; border-radius: 12px; background: #f3f0ff; font-size: 1.15rem; cursor: pointer; border: 3px solid transparent; user-select: none; }
  .tile.sel { border-color: #5b4bb7; background: #ddd6ff; }
  .tile.done { background: #c8f7c5; color: #2d7a2a; cursor: default; display: block; margin: 4px 0; padding: 6px; font-size: 1rem; }
  .tile.wrong { background: #ffc9c9; animation: shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @media (max-width: 560px) { .cols3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← Všechna témata</a><br>
  <h1>🍎 Neurčitý člen – a / an</h1>
  <div class="score">⭐ Body: <span id="score">0</span></div>
  <div class="voice">🔊 Hlas: <select id="voiceSel"><option>načítám…</option></select></div>
  <div class="voicewarn" id="voiceWarn"></div>
</header>
<nav>
  <button data-mode="learn" class="active">📖 Učím se</button>
  <button data-mode="quiz">❓ a, nebo an?</button>
  <button data-mode="sortMode">🗂️ Třídění</button>
  <button data-mode="write">✏️ Psaní</button>
</nav>
<main id="app"></main>

<script>
/* a = člen ("a", "an" nebo "" = bez členu), n = poznámka k výjimce */
const ITEMS = [
  { a: "an", w: "apple", cz: "jablko", e: "🍎" },
  { a: "an", w: "egg", cz: "vejce", e: "🥚" },
  { a: "an", w: "orange", cz: "pomeranč", e: "🍊" },
  { a: "an", w: "elephant", cz: "slon", e: "🐘" },
  { a: "an", w: "umbrella", cz: "deštník", e: "☂️", n: "u se tu čte [a]" },
  { a: "an", w: "ice cream", cz: "zmrzlina", e: "🍦" },
  { a: "an", w: "owl", cz: "sova", e: "🦉" },
  { a: "an", w: "onion", cz: "cibule", e: "🧅", n: "o se tu čte [a]" },
  { a: "an", w: "ant", cz: "mravenec", e: "🐜" },
  { a: "an", w: "octopus", cz: "chobotnice", e: "🐙" },
  { a: "an", w: "eye", cz: "oko", e: "👁️" },
  { a: "an", w: "island", cz: "ostrov", e: "🏝️", n: "čte se [ajlend]" },
  { a: "an", w: "hour", cz: "hodina", e: "⏰", n: "h se nečte – [auər]" },
  { a: "an", w: "old car", cz: "staré auto", e: "🚗", n: "rozhoduje přídavné jméno old" },
  { a: "an", w: "interesting book", cz: "zajímavá kniha", e: "📖", n: "rozhoduje přídavné jméno interesting" },
  { a: "a", w: "dog", cz: "pes", e: "🐶" },
  { a: "a", w: "cat", cz: "kočka", e: "🐱" },
  { a: "a", w: "banana", cz: "banán", e: "🍌" },
  { a: "a", w: "house", cz: "dům", e: "🏠", n: "h se tu čte" },
  { a: "a", w: "horse", cz: "kůň", e: "🐴", n: "h se tu čte" },
  { a: "a", w: "ball", cz: "míč", e: "⚽" },
  { a: "a", w: "pen", cz: "pero", e: "🖊️" },
  { a: "a", w: "uniform", cz: "uniforma", e: "👔", n: "u se čte [jú]" },
  { a: "a", w: "university", cz: "univerzita", e: "🎓", n: "u se čte [jú]" },
  { a: "a", w: "unicorn", cz: "jednorožec", e: "🦄", n: "u se čte [jú]" },
  { a: "a", w: "European city", cz: "evropské město", e: "🏙️", n: "eu se čte [jú]" },
  { a: "a", w: "big apple", cz: "velké jablko", e: "🍏", n: "rozhoduje přídavné jméno big" },
  { a: "a", w: "red umbrella", cz: "červený deštník", e: "🌂", n: "rozhoduje přídavné jméno red" },
  { a: "a", w: "small elephant", cz: "malý slon", e: "🐘", n: "rozhoduje přídavné jméno small" },
  { a: "", w: "apples", cz: "jablka", e: "🍎🍎", n: "množné číslo" },
  { a: "", w: "glasses", cz: "brýle", e: "👓", n: "brýle = vždy množné číslo" },
  { a: "", w: "scissors", cz: "nůžky", e: "✂️", n: "nůžky = vždy množné číslo" },
  { a: "", w: "trousers", cz: "kalhoty", e: "👖", n: "kalhoty = vždy množné číslo" },
  { a: "", w: "headphones", cz: "sluchátka", e: "🎧", n: "množné číslo" },
  { a: "", w: "eggs", cz: "vejce (víc kusů)", e: "🥚🥚", n: "množné číslo" },
];
const phrase = x => x.a ? `${x.a} ${x.w}` : x.w;
const artLabel = a => a || "— (bez členu)";
const why = x => {
  if (!x.a) return `Bez členu – ${x.n}.`;
  const base = x.a === "an" ? "začíná se samohláskou ve výslovnosti → <b>an</b>" : "začíná se souhláskou ve výslovnosti → <b>a</b>";
  return x.n ? `${x.n} → <b>${x.a}</b>` : base;
};

let score = +(localStorage.getItem("articleScore") || 0);
const app = document.getElementById("app");
const scoreEl = document.getElementById("score");
scoreEl.textContent = score;

function addScore(n) { score += n; localStorage.setItem("articleScore", score); scoreEl.textContent = score; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let voices = [], voice = null, csVoice = null;
const voiceSel = document.getElementById("voiceSel"), voiceWarn = document.getElementById("voiceWarn");
function voiceRank(v) {
  const l = v.lang.replace("_", "-").toLowerCase(), n = v.name.toLowerCase();
  let r = 0;
  if (l === "en-gb" || /united kingdom|uk english|british/.test(n)) r += 100;
  if (/natural|online|neural/.test(n)) r += 20;
  if (/google/.test(n)) r += 10;
  if (/sonia|ryan|libby|hazel|george|susan|daniel|kate|serena/.test(n)) r += 5;
  return r;
}
function loadVoices() {
  if (!("speechSynthesis" in window)) { voiceWarn.textContent = "Tento prohlížeč neumí předčítat."; return; }
  const all = speechSynthesis.getVoices();
  voices = all.filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceRank(b) - voiceRank(a));
  csVoice = all.filter(v => /^cs/i.test(v.lang)).sort((a, b) => (/natural|online|neural/i.test(b.name) ? 1 : 0) - (/natural|online|neural/i.test(a.name) ? 1 : 0))[0] || null;
  const hasGB = voices.some(v => voiceRank(v) >= 100);
  voiceWarn.innerHTML = (hasGB ? "" :
    "⚠️ Britský hlas nenalezen. Otevřete stránku v <b>Microsoft Edge</b> (hlasy Sonia/Ryan) nebo v <b>Chrome</b> (Google UK English), " +
    "případně ve Windows: Nastavení → Čas a jazyk → Jazyk a oblast → Přidat jazyk → English (United Kingdom) se zaškrtnutým <i>Převod textu na řeč</i>, pak restartovat prohlížeč.") +
    (csVoice || !all.length ? "" : (hasGB ? "" : "<br>") +
    "⚠️ Český hlas nenalezen, česká slovíčka se nebudou předčítat. Ve Windows: Nastavení → Čas a jazyk → Jazyk a oblast → Přidat jazyk → Čeština se zaškrtnutým <i>Převod textu na řeč</i>.");
  if (!voices.length) { voiceSel.innerHTML = "<option>žádný anglický hlas</option>"; return; }
  const saved = localStorage.getItem("schoolVoice");
  voice = voices.find(v => v.name === saved) || voices[0];
  voiceSel.innerHTML = voices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join("");
  voiceSel.value = voice.name;
}
voiceSel.onchange = () => { voice = voices.find(v => v.name === voiceSel.value); localStorage.setItem("schoolVoice", voice.name); speak("an apple and a banana"); };
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } else loadVoices();

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}
function speakCz(text) {
  if (!("speechSynthesis" in window) || !csVoice) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = csVoice; u.lang = csVoice.lang; u.rate = 0.9;
  speechSynthesis.speak(u);
}
function norm(s) { return s.toLowerCase().replace(/[’`]/g, "'").replace(/[.!]/g, "").replace(/\s+/g, " ").trim(); }

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  ({ learn, quiz, sortMode, write })[b.dataset.mode]();
});

/* 📖 Learn */
function cardsFor(list) {
  return `<div class="grid">${list.map(x => `<div class="card" data-i="${ITEMS.indexOf(x)}"><div class="emoji">${x.e}</div><div class="ph"><span class="art">${x.a}</span> ${x.w}</div><div class="cz">${x.cz} <span class="ico">🔊</span></div>${x.n ? `<div class="n">${x.n}</div>` : ""}</div>`).join("")}</div>`;
}
function learn() {
  app.innerHTML = `<h2>📖 Neurčitý člen <i>a / an</i></h2>
    <div class="box">Před podstatné jméno v jednotném čísle dáváme <b>a</b> nebo <b>an</b> (= nějaký, jeden).<br>
      🔑 Rozhoduje <b>výslovnost</b> (jak to slovo zní), ne písmeno!<br>
      👉 <b>an</b> – když slovo začíná <b>samohláskou ve výslovnosti</b>: <b>an</b> apple, <b>an</b> egg, <b>an</b> hour (h se nečte)<br>
      👉 <b>a</b> – když slovo začíná <b>souhláskou ve výslovnosti</b>: <b>a</b> dog, <b>a</b> uniform (čte se [jú]), <b>a</b> European city</div>
    <div class="box">🎨 Když je před slovem <b>přídavné jméno</b>, rozhoduje to přídavné jméno:<br>
      <b>an</b> apple → <b>a</b> big apple &nbsp;·&nbsp; <b>a</b> car → <b>an</b> old car</div>
    <div class="box">🚫 <b>Bez členu</b> je množné číslo a věci, které jsou vždy v množném čísle:<br>
      apples, eggs, <b>glasses</b> (brýle), <b>scissors</b> (nůžky), <b>trousers</b> (kalhoty), <b>headphones</b> (sluchátka)</div>
    <p class="center">Klikni na kartičku a poslechni si to. 🔊 Všimni si, že <b>a</b> se čte krátce [ə] a <b>an</b> [ən].</p>
    <h3>an 🍎</h3>${cardsFor(ITEMS.filter(x => x.a === "an"))}
    <h3>a 🐶</h3>${cardsFor(ITEMS.filter(x => x.a === "a"))}
    <h3>bez členu 👓</h3>${cardsFor(ITEMS.filter(x => !x.a))}`;
  app.querySelectorAll(".card").forEach(c => {
    const x = ITEMS[c.dataset.i];
    c.onclick = () => speak(phrase(x));
    c.querySelector(".cz").onclick = e => { e.stopPropagation(); speakCz(x.cz); };
  });
}

/* ❓ Quiz */
function quiz() {
  const order = shuffle([...shuffle(ITEMS.filter(x => x.a)).slice(0, 10), ...shuffle(ITEMS.filter(x => !x.a)).slice(0, 2)]);
  let i = 0, correct = 0;
  function show() {
    if (i >= order.length) return finish(correct, order.length, quiz);
    const x = order[i];
    app.innerHTML = `<h2>❓ a, nebo an? (${i + 1}/${order.length})</h2>
      <div class="progress"><div style="width:${i / order.length * 100}%"></div></div>
      <div class="big">${x.e}</div>
      <div class="sent"><span class="gap">?</span> ${x.w}</div>
      <p class="cz say-cz">${x.cz} <span class="ico">🔊</span></p>
      <div class="options three">${["a", "an", ""].map(a => `<button data-a="${a}">${artLabel(a)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div><div class="center" id="nx"></div>`;
    app.querySelector(".say-cz").onclick = () => speakCz(x.cz);
    app.querySelectorAll(".options button").forEach(b => b.onclick = () => {
      app.querySelectorAll(".options button").forEach(y => { y.disabled = true; if (y.dataset.a === x.a) y.classList.add("ok"); });
      const fb = app.querySelector("#fb");
      speak(phrase(x));
      if (b.dataset.a === x.a) {
        correct++; addScore(2);
        fb.innerHTML = `<span class="good">Výborně! ⭐ ${phrase(x)}<span class="note">${why(x)}</span></span>`;
        setTimeout(() => { i++; show(); }, 1800);
      } else {
        b.classList.add("bad");
        fb.innerHTML = `<span class="badc">Správně je: ${phrase(x)}<span class="note">${why(x)}</span></span>`;
        const n = app.querySelector("#nx"); n.innerHTML = `<button class="btn">Další ➡️</button>`; n.firstChild.onclick = () => { i++; show(); };
      }
    });
  }
  show();
}

/* 🗂️ Sort into columns */
function sortMode() {
  const set = shuffle([...shuffle(ITEMS.filter(x => x.a === "a")).slice(0, 4), ...shuffle(ITEMS.filter(x => x.a === "an")).slice(0, 4), ...shuffle(ITEMS.filter(x => !x.a)).slice(0, 2)]);
  let selected = null, done = 0, mistakes = 0;
  app.innerHTML = `<h2>🗂️ Roztřiď slova – klikni na slovo a pak na správný sloupec</h2>
    <div class="pool" id="pool">${set.map(x => `<span class="tile" data-i="${ITEMS.indexOf(x)}">${x.e} ${x.w}</span>`).join("")}</div>
    <div class="cols3">
      <div class="col" data-a="a"><h3>a</h3></div>
      <div class="col" data-a="an"><h3>an</h3></div>
      <div class="col" data-a=""><h3>bez členu</h3></div>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="center"><button class="btn" id="again">🔄 Nová sada</button></div>`;
  const fb = app.querySelector("#fb");
  app.querySelectorAll("#pool .tile").forEach(t => t.onclick = () => {
    if (selected) selected.classList.remove("sel");
    selected = t; t.classList.add("sel");
    app.querySelectorAll(".col").forEach(c => c.classList.add("hot"));
    speak(ITEMS[t.dataset.i].w);
  });
  app.querySelectorAll(".col").forEach(c => c.onclick = () => {
    if (!selected) { fb.innerHTML = `<span class="badc">Nejdřív klikni na slovo 🙂</span>`; return; }
    const x = ITEMS[selected.dataset.i], t = selected;
    if (c.dataset.a === x.a) {
      t.remove(); selected = null;
      app.querySelectorAll(".col").forEach(k => k.classList.remove("hot"));
      const d = document.createElement("div"); d.className = "tile done"; d.textContent = `${x.e} ${phrase(x)}`; c.appendChild(d);
      done++; addScore(1); speak(phrase(x));
      fb.innerHTML = `<span class="good">Správně! 👍<span class="note">${why(x)}</span></span>`;
      if (done === set.length) fb.innerHTML = `<span class="good">🎉 Hotovo! Chyb: ${mistakes}</span>`;
    } else {
      mistakes++; t.classList.add("wrong");
      fb.innerHTML = `<span class="badc">Zkus to znovu 🙂 Poslouchej, jak slovo začíná.</span>`;
      setTimeout(() => t.classList.remove("wrong"), 400);
    }
  });
  app.querySelector("#again").onclick = sortMode;
}

/* ✏️ Write */
function write() {
  const order = shuffle([...shuffle(ITEMS.filter(x => x.a)).slice(0, 8), ...shuffle(ITEMS.filter(x => !x.a)).slice(0, 2)]);
  let i = 0, correct = 0, tries = 0, hintLen = 0;
  function show() {
    if (i >= order.length) return finish(correct, order.length, write);
    const x = order[i]; tries = 0; hintLen = 0;
    const ans = phrase(x);
    app.innerHTML = `<h2>✏️ Napiš anglicky i se členem (${i + 1}/${order.length})</h2>
      <div class="progress"><div style="width:${i / order.length * 100}%"></div></div>
      <div class="big say-cz">${x.e} ${x.cz} 🔊</div>
      <div class="hint" id="hint"></div>
      <input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="např. an apple">
      <div class="center">
        <button class="btn" id="check">✔️ Zkontrolovat</button>
        <button class="btn light" id="hintBtn">💡 Nápověda</button>
        <button class="btn light" id="listen">🔊 Poslechnout</button>
        <button class="btn light" id="skip">⏭️ Nevím</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const inp = app.querySelector("#inp"), fb = app.querySelector("#fb"), hint = app.querySelector("#hint");
    inp.focus();
    speakCz(x.cz);
    app.querySelector(".say-cz").onclick = () => { speakCz(x.cz); inp.focus(); };
    const renderHint = () => hint.textContent = [...ans].map((c, k) => c === " " ? " " : (k < hintLen ? c : "_")).join("");
    renderHint();
    const next = () => setTimeout(() => { i++; show(); }, 1900);
    const fail = () => { fb.innerHTML = `<span class="badc">Správně je: <b>${ans}</b><span class="note">${why(x)}</span></span>`; speak(ans); inp.disabled = true; order.push(x); next(); };
    const check = () => {
      const v = norm(inp.value);
      if (!v) return;
      if (v === norm(ans)) {
        const pts = Math.max(1, 3 - tries - hintLen);
        correct++; addScore(pts); speak(ans);
        fb.innerHTML = `<span class="good">Správně! 🎉 +${pts}</span>`;
        inp.disabled = true; next();
        return;
      }
      tries++;
      const bare = v.replace(/^(a|an|the)\s+/, "");
      let msg = "Ještě ne, zkus to znovu";
      if (bare === norm(x.w)) msg = !x.a ? "Slovo je dobře, ale tady se člen nedává 🙂" : v === bare ? "Slovo je dobře – nezapomeň na člen a / an!" : "Slovo je dobře, ale člen ne – a, nebo an?";
      if (tries >= 3) fail();
      else fb.innerHTML = `<span class="badc">${msg} (pokus ${tries}/3)</span>`;
    };
    app.querySelector("#check").onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
    app.querySelector("#hintBtn").onclick = () => { if (hintLen < ans.length) { hintLen++; renderHint(); } inp.focus(); };
    app.querySelector("#listen").onclick = () => { speak(ans); inp.focus(); };
    app.querySelector("#skip").onclick = () => { if (!inp.disabled) fail(); };
  }
  show();
}

function finish(correct, total, again) {
  const pct = correct / total;
  const msg = pct === 1 ? "🏆 Perfektní!" : pct >= 0.7 ? "🌟 Skvělá práce!" : "💪 Dobrý začátek, procvič si to ještě!";
  app.innerHTML = `<div class="center"><h2>${msg}</h2><div class="big">${correct} / ${total}</div>
    <button class="btn" id="again">🔄 Znovu</button></div>`;
  app.querySelector("#again").onclick = again;
}

learn();
</script>
