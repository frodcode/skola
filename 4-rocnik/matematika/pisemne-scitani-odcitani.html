<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bb7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Písemné sčítání a odčítání ✏️</title>
<link rel="stylesheet" href="../../common/skola.css">
<style>
  .col-wrap { display: flex; justify-content: center; margin: 14px 0; }
  table.colm { border-collapse: collapse; font-size: 2.4rem; font-family: "Consolas", "Courier New", monospace; }
  table.colm td { width: 52px; height: 58px; text-align: center; padding: 0; }
  table.colm tr.carry td { height: 26px; font-size: 1.1rem; color: #c0392b; font-weight: bold; vertical-align: bottom; }
  table.colm tr.line td { border-top: 4px solid #333; height: 4px; }
  table.colm td.op { color: #5b4bb7; font-weight: bold; }
  table.colm td.cell { border: 2px dashed #bbb; border-radius: 8px; color: #2d7a2a; font-weight: bold; }
  table.colm td.cell.now { border: 3px solid #5b4bb7; background: #efeaff; }
  table.colm td.cell.wrong { background: #ffc9c9; animation: shake .3s; }
  table.colm td.cell.given { color: #c0392b; }
  table.colm td.hot { background: #fff3c4; border-radius: 6px; }
  .say { text-align: center; font-size: 1.25rem; min-height: 2em; }
  .ex { margin: 10px 0; }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← Všechna témata</a><br>
  <h1>✏️ Písemné sčítání a odčítání</h1>
  <div class="score">⭐ Body: <span id="score">0</span></div>
  <div class="voicewarn" id="voiceWarn"></div>
</header>
<nav>
  <button data-mode="learn" class="active">📖 Učím se</button>
  <button data-mode="plus">➕ Sčítání</button>
  <button data-mode="minus">➖ Odčítání</button>
  <button data-mode="big">🔀 Větší čísla</button>
</nav>
<main id="app"></main>

<script src="../../common/skola.js"></script>
<script src="../../common/cvic.js"></script>
<script>
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const dig = (n, k) => Math.floor(n / 10 ** k) % 10;
const len = n => String(n).length;

/* rozpis po sloupcích zprava: [{ d: číslice výsledku, c: přenos dál, t: co si říkám }] */
function solve(a, b, op) {
  const res = op === "+" ? a + b : a - b, n = len(res), out = [];
  let c = 0;
  for (let k = 0; k < n; k++) {
    const da = dig(a, k), db = dig(b, k), hasB = k < len(b);
    if (op === "+") {
      const s = da + db + c, parts = [k < len(a) ? da : null, hasB ? db : null, c || null].filter(x => x !== null);
      const t = parts.length > 1 ? `${parts.join(" + ")} = ${s}, píšu ${s % 10}${s >= 10 ? `, ${Math.floor(s / 10)} si pamatuju` : ""}` : `píšu ${s}`;
      out.push({ d: s % 10, c: Math.floor(s / 10), t, h: parts.length > 1 ? `${parts.join(" + ")} = ?` : "Opiš číslici." }); c = Math.floor(s / 10);
    } else {
      if (!hasB && !c) { out.push({ d: da, c: 0, t: `píšu ${da}`, h: "Dole nic není – opiš číslici." }); continue; }
      const what = db + c, pre = c && hasB ? `${db} + 1 = ${what}, ` : "";
      if (what <= da) { out.push({ d: da - what, c: 0, t: `${pre}${what} a kolik je ${da}? ${da - what}, píšu ${da - what}`, h: `${pre}${what} a kolik je ${da}?` }); c = 0; }
      else { const d = da + 10 - what; out.push({ d, c: 1, t: `${pre}${what} a kolik je ${da}? Nejde. ${what} a kolik je ${da + 10}? ${d}, píšu ${d}, 1 si pamatuju`, h: `${pre}${what} a kolik je ${da}? Nejde. ${what} a kolik je ${da + 10}?` }); c = 1; }
    }
  }
  return { res, cols: out };
}

function table(a, b, op, filled, carries, now) {
  const res = op === "+" ? a + b : a - b, W = Math.max(len(a), len(b), len(res)) + 1;
  const row = (n, k0) => Array.from({ length: W }, (_, i) => { const k = W - 1 - i; return k < len(n) ? `<td class="${k === now ? "hot" : ""}">${dig(n, k)}</td>` : `<td>${i === 0 && k0 ? k0 : ""}</td>`; }).join("");
  return `<table class="colm">
    <tr class="carry">${Array.from({ length: W }, (_, i) => `<td>${carries[W - 1 - i] ? "+" + carries[W - 1 - i] : ""}</td>`).join("")}</tr>
    <tr>${row(a)}</tr>
    <tr>${row(b, `<span class="op">${op === "+" ? "+" : "−"}</span>`)}</tr>
    <tr class="line">${"<td></td>".repeat(W)}</tr>
    <tr>${Array.from({ length: W }, (_, i) => { const k = W - 1 - i; return k < len(res) ? `<td class="cell ${k === now ? "now" : ""} ${filled[k] && filled[k].given ? "given" : ""}" data-k="${k}">${filled[k] ? filled[k].d : ""}</td>` : "<td></td>"; }).join("")}</tr>
  </table>`;
}

function learn() {
  const p = solve(358, 476, "+"), m = solve(723, 458, "-");
  const block = (a, b, op, s, title, intro) => `<h3 class="hs" data-say="${title}">${op === "+" ? "➕" : "➖"} ${title} <span class="ico">🔊</span></h3>
    <div class="box clk" data-say="${intro}">${intro} <span class="ico">🔊</span></div>
    <div class="col-wrap">${table(a, b, op, Object.fromEntries(s.cols.map((c, k) => [k, { d: c.d }])), Object.fromEntries(s.cols.map((c, k) => [k + 1, c.c]).filter(x => x[1])), -1)}</div>
    ${s.cols.map((c, k) => `<div class="ex center clk" data-say="${czRead(c.t)}">${["Jednotky", "Desítky", "Stovky", "Tisíce"][k] || ""}: ${c.t} <span class="ico">🔊</span></div>`).join("")}`;
  app.innerHTML = `<h2 class="clk" data-say="Písemné sčítání a odčítání">📖 Písemné sčítání a odčítání <span class="ico">🔊</span></h2>
    <div class="box clk" data-say="Čísla píšu přesně pod sebe: jednotky pod jednotky, desítky pod desítky, stovky pod stovky. Počítám zprava, od jednotek.">📏 Čísla píšu <b>přesně pod sebe</b> (jednotky pod jednotky…). Počítám <b>zprava</b> – od jednotek. <span class="ico">🔊</span></div>
    ${block(358, 476, "+", p, "Sčítání", "Sečtu sloupec. Když vyjde víc než 9, píšu jednotky a 1 si pamatuju do dalšího sloupce.")}
    ${block(723, 458, "-", m, "Odčítání", "Odčítám doplňováním: kolik musím přičíst k dolnímu číslu, abych dostal horní. Když to nejde, přidám 10 a 1 si pamatuju.")}`;
  czBind();
}

function practice(gen, title, again) {
  cvicRound(Array.from({ length: 5 }, gen), again, (x, i, n, done) => {
    const s = solve(x.a, x.b, x.op), filled = {}, carries = {};
    let k = 0, tries = 0, mistakes = 0;
    function draw(msg) {
      app.innerHTML = `${cvicHead(title, i, n)}
        <p class="center clk" id="ask">Vypočítej písemně. Začni od jednotek – vpravo. <span class="ico">🔊</span></p>
        <div class="col-wrap">${table(x.a, x.b, x.op, filled, carries, k < s.cols.length ? k : -1)}</div>
        <div class="say" id="fb">${msg || ""}</div>
        <div class="pad num">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button data-k="${d}">${d}</button>`).join("")}</div>
        <div class="center"><button class="btn light" id="hint">💡 Nápověda</button> <button class="btn light" id="skip">⏭️ Nevím</button></div>`;
      app.querySelector("#ask").onclick = () => speakCz("Vypočítej písemně. Začni od jednotek, vpravo.");
      app.querySelectorAll(".pad button").forEach(b => b.onclick = () => put(+b.dataset.k));
      app.querySelector("#hint").onclick = () => { if (k >= s.cols.length) return; tries = Math.max(tries, 1); mistakes = Math.max(mistakes, 1); show(s.cols[k].h); };
      app.querySelector("#skip").onclick = () => { if (k < s.cols.length) { mistakes += 2; give(); } };
    }
    const show = (t, say = t) => { const fb = app.querySelector("#fb"); fb.innerHTML = `<span class="note">${t}</span>`; speakCz(czRead(say)); };
    function advance(given) {
      const col = s.cols[k];
      filled[k] = { d: col.d, given };
      if (col.c) carries[k + 1] = col.c;
      k++; tries = 0;
      if (k < s.cols.length) return draw(given ? `<span class="badc">${col.t}</span>` : `<span class="good">✔️ ${col.t}</span>`);
      const pts = mistakes ? 1 : 3; addScore(pts);
      draw(`<span class="good">Hotovo! ${x.a} ${x.op === "+" ? "+" : "−"} ${x.b} = ${s.res} 🎉 +${pts}</span>`);
      speakCz(czMath(`${x.a} ${x.op === "+" ? "+" : "−"} ${x.b} = ${s.res}`));
      app.querySelectorAll(".pad button, #hint, #skip").forEach(b => b.disabled = true);
      cvicAfterSpeech(() => done(mistakes < 2), 2500);
    }
    function give() { const t = s.cols[k].t; advance(true); speakCz(czRead(t)); }
    function put(d) {
      if (k >= s.cols.length) return;
      if (d === s.cols[k].d) { advance(false); return; }
      tries++; mistakes++;
      const cell = app.querySelector(`td.cell[data-k="${k}"]`);
      cell.textContent = d; cell.classList.add("wrong");
      setTimeout(() => { cell.textContent = ""; cell.classList.remove("wrong"); }, 500);
      if (tries >= 3) return setTimeout(give, 600);
      show(`Ještě ne (pokus ${tries}/3). ${s.cols[k].h}`, `Ještě ne. ${s.cols[k].h}`);
    }
    document.onkeydown = e => { if (/^\d$/.test(e.key) && document.getElementById("ask")) put(+e.key); };
    draw();
    speakCz(czMath(`${x.a} ${x.op === "+" ? "+" : "−"} ${x.b}`));
  });
}

/* chceme aspoň jeden přenos – bez něj je to moc snadné */
const hasCarry = x => solve(x.a, x.b, x.op).cols.some(c => c.c);
function genPlus() { const a = rnd(100, 899), b = rnd(100, 999 - a); const x = { a, b, op: "+" }; return b >= 100 && hasCarry(x) ? x : genPlus(); }
function genMinus() { const a = rnd(200, 999), b = rnd(100, a - 1); const x = { a, b, op: "-" }; return hasCarry(x) ? x : genMinus(); }
function genBig() {
  if (Math.random() < .5) { const a = rnd(1000, 8999), b = rnd(100, 9999 - a); const x = { a, b, op: "+" }; return hasCarry(x) ? x : genBig(); }
  const a = rnd(1000, 9999), b = rnd(100, a - 1); const x = { a, b, op: "-" }; return hasCarry(x) ? x : genBig();
}

const plus = () => practice(genPlus, "➕ Písemné sčítání", plus);
const minus = () => practice(genMinus, "➖ Písemné odčítání", minus);
const big = () => practice(genBig, "🔀 Větší čísla", big);

skolaStart({ scoreKey: "mPisemneScore", english: false, modes: { learn, plus, minus, big } });
</script>
</body>
</html>
