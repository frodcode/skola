<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bb7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<title>Barvy – Colours 🎨</title>
<link rel="stylesheet" href="../../common/skola.css">
</head>
<body>
<header>
  <a class="home" href="index.html">← Všechna témata</a><br>
  <h1>🎨 Colours – Barvy</h1>
  <div class="score">⭐ Body: <span id="score">0</span></div>
  <div class="voice">🔊 Hlas: <select id="voiceSel"><option>načítám…</option></select></div>
  <div class="voicewarn" id="voiceWarn"></div>
</header>
<nav>
  <button data-mode="learn" class="active">📖 Učím se</button>
  <button data-mode="listen">👂 Poslech</button>
  <button data-mode="match">🔗 Přiřazování</button>
  <button data-mode="quiz">❓ Kvíz</button>
  <button data-mode="write">✏️ Psaní</button>
</nav>
<main id="app"></main>

<script src="../../common/skola.js"></script>
<script>
const dot = (c, border) => `<span style="display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.12em;background:${c};border:${border ? "2px solid #999" : "0"}"></span>`;
skolaVocab({
  scoreKey: "coloursScore",
  demo: "My favourite colour is blue.",
  words: [
    { cz: "červená", en: "red", e: dot("#e53935") },
    { cz: "zelená", en: "green", e: dot("#43a047") },
    { cz: "modrá", en: "blue", e: dot("#1e88e5") },
    { cz: "žlutá", en: "yellow", e: dot("#fdd835") },
    { cz: "černá", en: "black", e: dot("#111") },
    { cz: "bílá", en: "white", e: dot("#fff", true) },
    { cz: "hnědá", en: "brown", e: dot("#795548") },
    { cz: "růžová", en: "pink", e: dot("#f48fb1") },
  ],
  learnExtra: `<div class="box">💡 V Británii se píše <b>colour</b>, v Americe <b>color</b>. What colour is it? – It's <b>red</b>.</div>`,
});
</script>
</body>
</html>
